    <script>
        function cerrarTodasLasVentanas() {
            // Si la ventana emergente sigue abierta, redirigirla a logout.php
            if (window.opener && !window.opener.closed) {
                window.opener.location.href = 'logout.php';
            }
        
            // Redirigir la ventana actual a logout.php
            window.location.href = 'logout.php';
        }
        </script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("verificar_sesion.php")
            .then(response => response.json())
            .then(data => {
                if (data.sesion_activa) {
                    document.getElementById("nombreUsuario").textContent = "Bienvenido, " + data.nombre_completo;
                } else {
                    window.location.href = "login.php";
                }
            });
    });
    </script>
